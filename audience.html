<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Технологии творчества · Кабинет администратора · Выгрузка аудитории</title>
<meta name="description" content="Кабинет администратора: отбор контактов зрителей и выгрузка в CSV." />
<meta name="robots" content="noindex" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="admin.css?v=21" />
</head>
<body class="admin" data-page="audiences">

<!-- ░░░ SIDEBAR ░░░ -->
<aside class="side">
  <a class="side-brand" href="index.html">
    <img src="assets/logo.png" alt="Технологии творчества" />
    <span class="sb-cap">Кабинет<br>администратора</span>
  </a>

  <div class="side-profile">
    <span class="avatar" aria-hidden="true">АВ</span>
    <span class="sp-info">
      <b>А. Винтур</b>
      <em>директор по продажам</em>
    </span>
  </div>

  <nav class="side-nav" id="sideNav" aria-label="Разделы кабинета"></nav>

  <a class="side-back" href="index.html">← Вернуться на сайт</a>
</aside>

<!-- ░░░ MAIN ░░░ -->
<main class="main">
  <header class="top">
    <div class="top-title">
      <p class="crumb">Технологии творчества · Маркетинг</p>
      <h1 id="audTitle">Выгрузка</h1>
    </div>
  </header>

  <!-- хлебные крошки -->
  <nav class="crumbs" aria-label="Навигация">
    <a href="admin.html">Консоль</a>
    <span class="crumbs-sep" aria-hidden="true">/</span>
    <a href="audiences.html">Аудитории</a>
    <span class="crumbs-sep" aria-hidden="true">/</span>
    <span class="crumbs-cur" id="audCrumbTail">Выгрузка</span>
  </nav>

  <div id="audBody">
    <section class="panel pad">
      <!-- пороги отбора -->
      <div class="aud-form">
        <div class="aud-fields" id="audFields"></div>
        <button class="btn aud-csv" id="audCsv" type="button">Экспорт в CSV</button>
      </div>

      <!-- период продаж -->
      <div class="aud-range">
        <div class="rv-group rv-group-range">
          <span class="rv-addon">выберите диапазон дат продаж</span>
          <input id="audFrom" type="date" class="rv-date" aria-label="Дата продаж с" />
          <span class="rv-dash" aria-hidden="true">—</span>
          <input id="audTo" type="date" class="rv-date" aria-label="Дата продаж по" />
        </div>
        <button class="btn btn-gold" id="audRun" type="button">Показать</button>
        <p class="aud-hint">Пустой диапазон — за всё время.</p>
      </div>
    </section>

    <!-- результат -->
    <section class="panel pad" id="audResultWrap" hidden>
      <div class="panel-head">
        <h2>Контакты</h2>
        <span class="ph-total" id="audCount"></span>
      </div>
      <div id="audResult"></div>
    </section>
  </div>
</main>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="admin-nav.js?v=6"></script>
<script src="admin-store.js?v=8"></script>
<script src="admin-audiences.js?v=2"></script>
<script src="admin-audience-view.js?v=1"></script>
</body>
</html>
