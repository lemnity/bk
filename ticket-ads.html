<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Технологии творчества · Кабинет администратора · Реклама на билетах</title>
<meta name="description" content="Кабинет администратора: рекламные макеты на билетах — загрузка, привязка к представлениям, ссылки." />
<meta name="robots" content="noindex" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="admin.css?v=20" />
</head>
<body class="admin" data-page="ticket-ads">

<!-- ░░░ SIDEBAR ░░░ -->
<aside class="side">
  <a class="side-brand" href="index.html">
    <img src="assets/logo.png" alt="Технологии творчества" />
    <span class="sb-cap">Кабинет<br>администратора</span>
  </a>

  <div class="side-profile">
    <span class="avatar" aria-hidden="true">АВ</span>
    <span class="sp-info">
      <b>А. Винтур</b>
      <em>директор по продажам</em>
    </span>
  </div>

  <nav class="side-nav" id="sideNav" aria-label="Разделы кабинета"></nav>

  <a class="side-back" href="index.html">← Вернуться на сайт</a>
</aside>

<!-- ░░░ MAIN ░░░ -->
<main class="main">
  <header class="top">
    <div class="top-title">
      <p class="crumb">Технологии творчества · Маркетинг</p>
      <h1>Реклама на билетах</h1>
    </div>
  </header>

  <!-- хлебные крошки -->
  <nav class="crumbs" aria-label="Навигация">
    <a href="admin.html">Консоль</a>
    <span class="crumbs-sep" aria-hidden="true">/</span>
    <span class="crumbs-cur">Реклама на билетах</span>
  </nav>

  <!-- ░ ЗАГРУЗКА ░ -->
  <section class="panel pad">
    <div class="ad-top">
      <div class="ad-upload">
        <p class="ad-upload-t">Выберите изображение</p>
        <input type="file" id="adFile" accept="image/jpeg,image/png" />
        <button class="btn btn-gold" id="adAdd" type="button">Добавить изображение</button>
        <p class="ad-hint">Поддерживаются форматы JPG или PNG</p>
        <p class="ad-hint">Максимальный размер файла: 500&nbsp;Кб</p>
      </div>

      <!-- требования печатаются из FORMATS: подсказка и проверка -->
      <!-- при загрузке не могут разойтись -->
      <div class="ad-specs" id="adSpecs"></div>

      <button class="btn ad-logs-btn" id="adLogsBtn" type="button" aria-expanded="false"
              aria-controls="adLogsWrap">☰ Логи</button>
    </div>

    <p class="ad-err ad-err-top" id="adUploadErr" role="alert" hidden></p>
  </section>

  <!-- ░ ЛОГИ ░ -->
  <section class="panel pad" id="adLogsWrap" hidden>
    <div class="panel-head">
      <h2>Логи</h2>
      <span class="ph-total" id="adLogCount"></span>
    </div>
    <div id="adLogs"></div>
  </section>

  <!-- ░ МАКЕТЫ ░ -->
  <section class="panel pad">
    <div class="ad-filter" id="adFilter">
      <label><input type="radio" name="adf" value="all" checked /><span>все</span></label>
      <label><input type="radio" name="adf" value="common" /><span>общие</span></label>
      <label><input type="radio" name="adf" value="shows" /><span>для представлений</span></label>
    </div>
    <div id="adGrid"></div>
  </section>
</main>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="admin-nav.js?v=6"></script>
<script src="admin-store.js?v=8"></script>
<script src="admin-ticket-ads.js?v=1"></script>
</body>
</html>
