<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ТБДТ · Кабинет администратора · Отчёты</title>
<meta name="description" content="Кабинет администратора: каталог отчётов театра — общие, кассовые, музейные, новые и приказы." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="admin.css?v=8" />
</head>
<body class="admin" data-page="reports">

<!-- ░░░ SIDEBAR ░░░ -->
<aside class="side">
  <a class="side-brand" href="index.html">
    <img src="assets/logo.png" alt="Театр Либерта" />
    <span class="sb-cap">Кабинет<br>администратора</span>
  </a>

  <div class="side-profile">
    <span class="avatar" aria-hidden="true">АВ</span>
    <span class="sp-info">
      <b>А. Винтур</b>
      <em>директор по продажам</em>
    </span>
  </div>

  <nav class="side-nav" id="sideNav" aria-label="Разделы кабинета"></nav>

  <a class="side-back" href="index.html">← Вернуться на сайт</a>
</aside>

<!-- ░░░ MAIN ░░░ -->
<main class="main">
  <header class="top">
    <div class="top-title">
      <p class="crumb">ТБДТ · Администрирование</p>
      <h1 id="pageTitle">Отчёты</h1>
    </div>
  </header>

  <div class="tab" data-panel="reports">

    <!-- ░ ИЗБРАННОЕ ░ -->
    <section class="panel pad">
      <div class="panel-head">
        <h2>Избранные отчёты</h2>
        <span class="ph-total" id="repFavCount"></span>
      </div>
      <div id="repFav"></div>
    </section>

    <!-- ░ КАТАЛОГ ░ -->
    <section class="panel pad">
      <div class="panel-head">
        <h2>Все отчёты</h2>
        <span class="ph-total" id="repTotal"></span>
      </div>

      <div class="rep-toolbar">
        <div class="rep-filter" id="repFilter" role="tablist" aria-label="Тип отчёта"></div>
        <label class="rep-search">
          <span class="vh">Поиск по названию или номеру отчёта</span>
          <input id="repSearch" type="search" autocomplete="off"
                 placeholder="Поиск по названию или номеру" />
        </label>
      </div>

      <div id="repList"></div>
    </section>

  </div>
</main>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="admin-nav.js?v=1"></script>
<script src="admin-store.js?v=3"></script>
<script src="admin-reports.js?v=3"></script>
</body>
</html>
